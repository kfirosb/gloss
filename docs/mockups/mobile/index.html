const screens=[['home','Home','A little less checking.','Stories collect new responses. A separate status tells you whether the agent still needs an answer.'],['story','Story · choose an option','Read. Decide. Keep moving.','The response stays unread until its end has been visible for a moment. Seen and answered are independent.'],['complete','Story · completed work','A result worth seeing.','Completion appears unread, just like any response. Reading adds Seen; it never sends an acknowledgement to the agent.'],['approval','Story · approval','Know what you are allowing.','A distinct approval surface shows the exact command, destination, and scope. Approval here is a proposed interface only.'],['chat','Agent conversation','The whole conversation.','An Instagram-style conversation with context, image attachments, quick replies, and a freeform composer.'],['compose','Write a reply','Room for your own words.','Write in your language, attach an image, or preview dictation. Review the translated instruction before sending.'],['review','Translation review','Your meaning. Your approval.','The exact instruction is visible before delivery. Edit or send explicitly.'],['image','Images · full screen','Get closer to the work.','A swipeable image gallery with fullscreen previews and zoom controls.'],['inbox','Conversation inbox','Nothing slips through.','Find conversations by project or agent. Unread, waiting, and running are separate signals.'],['profile','Profile & projects','Your whole world of work.','A personal home for every project, plus your computers and preferences.'],['project','Inside a project','Context, kept together.','Sessions, worktrees, progress, and recent results belong to their project.'],['activity','Activity','A quiet, useful overview.','Read receipts, delivery results, and agent progress, all in one timeline.'],['settings','Settings & accessibility','Make it comfortable.','Text size, Hebrew reading, theme, notification privacy, and device access.'],['welcome','Welcome','Your agents. In your pocket.','An uncomplicated introduction to connecting your computer.'],['pair','Pair a computer','One deliberate connection.','A sample pairing journey. The QR is illustrative and cannot connect to a real computer.'],['devices','Connected devices','Access you can see.','Review the computer and phones, revoke a device, or pause phone access.'],['offline','Computer offline','Honest about connection.','Saved content is labeled. Replies remain drafts until the computer reconnects.'],['error','Delivery uncertain','No accidental second send.','If a receipt is missing, keep the text and check status. Never silently resend.'],['empty','All caught up','A moment to step away.','An empty unread inbox does not mean every outstanding decision has been answered.']];
let state={sentBy:{},project:'GLOSS',session:'story',page:'home',gallery:false,seen:{},answered:{},filter:'All',draft:'',sent:'',large:false,hebrew:false,dark:false,paused:false,revoked:false};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(active='home'){return `<nav class="bottom-nav" aria-label="App navigation">${[['home','home','Home'],['chat','inbox','Chats'],['bell','activity','Activity'],['profile','profile','You']].map(([i,p,t])=>`<button data-go="${p}" class="${active===p?'selected':''}">${i==='profile'?'<span class="profile-mini">KB</span>':icon(i)}<span>${t}</span></button>`).join('')}</nav>`}
function head(title,sub='',back='home',actions=''){return `<header class="app-head"><div class="row">${btn('back','go:'+back,'Back')}<div><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div></div><div class="head-actions">${actions}</div></header>`}
function avatar(text='C',color='coral'){return `<span class="avatar ${color}">${text}</span>`}
function art(second=false,full=false){return `<${full?'div':'button'} class="art ${second?'second':''}" ${full?'':'data-go="image" aria-label="Open design preview"'}><span class="mini-top">FIELDNOTES <span>Objects for everyday living ↗</span></span><h4>${second?'Less, but<br>more considered.':'Make space<br>for the everyday.'}</h4><span class="mini-button">Explore the collection ↗</span><span class="orb"></span>${full?'':'<span class="image-count">▧ 2</span>'}</${full?'div':'button'}>`}
function receipt(id){return `<div class="read-receipt" data-receipt="${id}">${state.seen[id]?icon('double')+' Seen · just now':'<span class="unread-dot"></span> Unread'}</div>`}
function home(){let unread=['story','complete','approval'].filter(k=>!state.seen[k]).length;return `<header class="app-head"><div class="wordmark"><span class="mark">g</span>gloss<span style="color:var(--accent)">.</span></div><div class="head-actions"><button class="chip" data-go="devices"><span class="green-dot"></span>Mac online</button>${btn('settings','go:settings','Settings')}</div></header><div class="scroll"><div class="pad"><div class="eyebrow muted" style="font-size:9px;margin:9px 0">SATURDAY, OCTOBER 31</div><h2 class="greeting serif">Good morning, Kfir.</h2><p class="sub">${unread} new responses. Your next move is here.</p></div><div class="stories">${[['story','C','coral','Checkout','2 options'],['complete','⌘','','Website','New result'],['approval','C','purple','API','Approval'],['project','↗','dark','GLOSS','Working']].map(([id,a,c,t,s])=>`<button class="story-button" data-go="${id}"><div class="ring ${state.seen[id]||id==='project'?'read':''}">${avatar(a,c)}</div>${t}<small>${state.answered[id]?'Working':s}</small></button>`).join('')}</div><div class="tabs">${['All','Unread','Needs you','Running'].map(t=>`<button class="chip ${state.filter===t?'on':''}" data-filter="${t}">${t}${t==='Unread'?' · '+unread:''}</button>`).join('')}</div>${state.filter==='Running'?`<div class="feed-card"><div class="card-top">${avatar('⌘','dark')}<div><strong>Codex <span class="muted">/ GLOSS</span></strong><span class="tiny muted">Working · mobile-navigation</span></div></div><div class="card-body"><h3>Making room for mobile.</h3><p>Updating the navigation and checking Hebrew layouts at phone width.</p></div><div class="card-footer">Running for 4 minutes<button class="text-link" data-go="project">View session ↗</button></div></div>`:`${state.filter!=='Needs you'&&(state.filter!=='Unread'||!state.seen.complete)?`<article class="feed-card"><div class="card-top">${avatar('⌘')}<div style="flex:1"><strong>Codex <span class="muted">/ Fieldnotes</span></strong><span class="tiny muted">Website redesign · 2 min ago</span></div><span class="${state.seen.complete?'muted':'unread-dot'}">${state.seen.complete?'✓':''}</span></div><div class="card-body"><h3>A calmer home for<br>the things you make.</h3><p>The new landing page is ready. Two directions to explore.</p>${art()}</div><div class="card-footer"><span>${state.seen.complete?'✓ Seen':'● Unread'} · Completed</span><button class="text-link" data-go="complete">Read response ↗</button></div></article>`:''}${(state.filter!=='Unread'||!state.seen.story)?`<article class="feed-card"><div class="card-top">${avatar()}<div><strong>Claude <span class="muted">/ Checkout</span></strong><span class="tiny muted">Payment flow · 8 min ago</span></div></div><div class="card-body"><span class="badge">${state.answered.story?'Working':'Your choice'}</span><h3 style="margin-top:10px">How should we handle<br>a failed payment?</h3><p>Two approaches, with a recommendation. A quick decision to keep things moving.</p></div><div class="card-footer"><span>${state.seen.story?'✓ Seen':'● Unread'} · ${state.answered.story?'Answered':'Waiting for you'}</span><button class="text-link" data-go="story">${state.answered.story?'View response':'See options'} ↗</button></div></article>`:''}${(state.filter!=='Unread'||!state.seen.approval)?`<article class="feed-card"><div class="card-top">${avatar('C','purple')}<div><strong>Claude <span class="muted">/ API</span></strong><span class="tiny muted">Database migration · 12 min ago</span></div></div><div class="card-body"><span class="badge">Approval required</span><h3 style="margin-top:10px">Run the staging migration?</h3></div><div class="card-footer"><span>${state.seen.approval?'✓ Seen':'● Unread'}</span><button class="text-link" data-go="approval">Review action ↗</button></div></article>`:''}`}${state.filter==='Unread'&&!unread?`<div class="center pad"><h2 class="empty-title">You're up to date.</h2><p class="sub">Everything has been seen. Pending decisions are still under Needs you.</p></div>`:''}</div>${nav()}`}
function story(kind='story'){const done=kind==='complete',approval=kind==='approval';return `<div class="story-progress"><span class="${!done&&!approval?'current':''}"></span><span class="${done?'current':''}"></span><span class="${approval?'current':''}"></span></div>${head(done?'Fieldnotes':approval?'API':'Checkout',done?'Codex · website-redesign':approval?'Claude · staging-migration':'Claude · payment-recovery','home',btn('type','textsize','Toggle text size')+btn('chat','go:chat','Open conversation'))}<div class="scroll story-scroll" data-read="${kind}"><div class="story-meta"><span class="badge ${done?'green':''}">${done?'Completed':approval?'Permission required':state.answered.story?'Working on your choice':'Waiting for your choice'}</span><h2 class="story-title">${done?'A little more breathing room.':approval?'Ready to update staging.':'A payment failed.<br>What happens next?'}</h2><div class="reading" ${state.hebrew?'dir="rtl" lang="he"':''}>${state.hebrew?`<p>${done?'העמוד החדש מוכן. יצרתי שתי אפשרויות עיצוב עם טיפוגרפיה ברורה ותמונות גדולות.':approval?'המיגרציה מוכנה להרצה בסביבת הבדיקות. אפשר לעיין בפקודה המדויקת לפני אישור.':'בדקתי את תהליך התשלום. אם התשלום נכשל, אפשר לנסות שוב באופן אוטומטי או לאפשר למשתמש לבחור אמצעי תשלום אחר.'}</p><p>אפשר לקרוא את כל הפרטים בשיחה ולבחור את הצעד הבא למטה.</p>`:done?`<p>I’ve finished the first pass of the Fieldnotes landing page. More space, quieter colors, and a clearer path into the collection.</p><p>Both directions work at mobile width. Here’s how they look:</p>`:approval?`<p>The migration adds a <code>retry_count</code> column. I’d like to run it against the staging database before continuing.</p><p>This will change the staging schema. Production is not targeted by this command.</p>`:`<p>I traced the checkout flow. When a payment fails, we currently drop the user back at the start.</p><p>I recommend letting them choose another payment method while keeping their cart. It’s clearer and avoids an unexpected second charge.</p><p>Which approach would you like me to implement?</p>`}</div>${done?`${art()}<div class="row between"><span class="sub">2 design previews</span><button class="text-link" data-go="image">View both ↗</button></div><div class="help-card" style="margin:16px 0">✓ Responsive layouts checked<br>✓ Hebrew reading order preserved<br>✓ Images optimized</div>`:approval?'<div class="code-block">pnpm db:migrate --env staging</div><p class="tiny muted">Project: API · staging-migration<br>Scope: this command, once</p>':''}<div data-read-end="${kind}">${receipt(kind)}</div></div></div><div class="choices">${done?`<div class="eyebrow">What would you like to do next?</div><button class="primary full" data-go="chat">Discuss this result ${icon('arrow')}</button><button class="choice-other" data-go="home">Back to my updates</button>`:approval?`<div class="eyebrow">Review the exact action above</div><button class="primary full" data-action="approve">Allow this command once</button><div class="row" style="margin-top:8px"><button class="secondary" style="flex:1" data-action="deny">Deny</button><button class="secondary" style="flex:1" data-go="compose">Ask a question</button></div>`:state.answered.story?`<div class="delivery">${icon('double')} Delivered to Claude<br><span class="tiny">Your choice: ${escapeHtml(state.answered.story)}</span></div><button class="choice-other" data-go="complete">Next response →</button>`:`<div class="eyebrow">Choose your next step</div><button class="choice" data-reply="Let the user choose another payment method."><b>1</b><span><strong>Choose another method</strong><small>Keep the cart, give the user control</small></span><span class="recommend">SUGGESTED</span></button><button class="choice" data-reply="Retry the payment automatically once."><b>2</b><span><strong>Retry automatically</strong><small>One retry before showing an error</small></span></button><button class="choice-other" data-go="compose">${icon('plus')} Write something else</button>`}</div>`}
function chat(){if(state.session==='complete')return resultChat();if(state.session==='approval')return approvalChat();return `${head('Claude','Checkout · payment-recovery','inbox',btn('dots','go:project','Project details'))}<div class="scroll" data-read="story"><div class="pad"><div class="date-line">TODAY · 9:32 AM</div><div class="message user">Can you make the failed payment flow less frustrating?</div><div class="row" style="margin-top:22px">${avatar()}<span class="tiny muted">Claude · 9:34 AM</span></div><div class="message agent"><p>I found the problem: we clear the checkout state after a failure, so the customer has to start again.</p><p style="margin-top:12px">I recommend keeping their cart and letting them choose another payment method.</p></div><div class="message agent">Which approach should I implement?<br><br><strong>1.</strong> Choose another payment method<br><strong>2.</strong> Retry automatically once</div><div data-read-end="story">${receipt('story')}</div>${state.sent?`<div class="message user">${escapeHtml(state.sent)}</div><p class="tiny muted" style="text-align:right">✓✓ Delivered · just now</p>`:''}<div class="tabs" style="padding:12px 0"><button class="chip" data-reply="Let the user choose another payment method.">Choose option 1</button><button class="chip" data-reply="Retry the payment automatically once.">Choose option 2</button></div><button class="text-link" data-go="complete">View an image conversation ↗</button></div></div><div class="composer-bar">${btn('image','attach','Attach an image')}<button class="compose-prompt" data-go="compose">Message Claude…</button>${btn('mic','dictate','Dictate a reply')}</div>`}
function resultChat(){return `${head('Codex','Fieldnotes · website-redesign','inbox')}<div class="scroll" data-read="complete"><div class="pad"><div class="date-line">TODAY · 9:39 AM</div><div class="message user">Make the landing page feel calmer. Show me two directions.</div><div class="row">${avatar('⌘')}<span class="tiny muted">Codex · just now</span></div><div class="message agent">Both directions are ready. The sage version feels quieter; the terracotta version is warmer.${art()}<button class="text-link" data-go="image">Open both previews ↗</button></div><div class="message agent">The mobile layouts are checked and the Hebrew reading order is preserved.</div><div data-read-end="complete">${receipt('complete')}</div>${state.sentBy.complete?`<div class="message user">${escapeHtml(state.sentBy.complete)}</div><p class="tiny muted">✓✓ Delivered · just now</p>`:''}<button class="secondary full" data-go="complete">Read the full result</button></div></div><div class="composer-bar"><button class="compose-prompt" data-action="result-reply">Message Codex…</button>${btn('image','go:image','View images')}</div>`}
function approvalChat(){return `${head('Claude','API · staging-migration','inbox')}<div class="scroll pad" data-read="approval"><div class="date-line">TODAY · 9:27 AM</div><div class="message user">Prepare the retry-count migration for staging.</div><div class="message agent">The migration is ready. It adds a retry_count column. I need your permission before running it.<div class="code-block">pnpm db:migrate --env staging</div></div><div data-read-end="approval">${receipt('approval')}</div><button class="primary full" data-go="approval">Review permission request</button></div>`}
function context(){return state.session==='complete'?{agent:'Codex',project:'Fieldnotes',branch:'website-redesign'}:state.session==='approval'?{agent:'Claude',project:'API',branch:'staging-migration'}:{agent:'Claude',project:'Checkout',branch:'payment-recovery'}}
function compose(){const c=context();return `${head('Your reply',`To ${c.agent} · ${c.project}`,'chat',btn('close','go:chat','Close composer'))}<div class="scroll"><div class="pad"><span class="badge green">${state.hebrew?'עברית → English':'English · original wording'}</span><textarea class="editor" id="draft" aria-label="Your message" placeholder="What would you like to tell Claude?" dir="auto">${escapeHtml(state.draft)}</textarea><div class="tool-row">${btn('image','attach','Add image')}${btn('mic','dictate','Try sample dictation')}<span class="sub">Words, images, or your voice.</span></div><div id="attachment"></div><div class="notice">Your reply goes to <strong>${c.project} / ${c.branch}</strong>. You review it before anything is sent.</div><button class="primary full" data-action="review">Review reply ${icon('arrow')}</button><p class="tiny muted center" style="margin-top:12px">Demo keyboard below · use your real keyboard to type</p></div></div><div class="keyboard" aria-hidden="true">${['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div class="key-row">${[...r].map(k=>`<span>${k}</span>`).join('')}</div>`).join('')}<div class="key-row"><span style="width:47px">123</span><span class="space">space</span><span style="width:67px">return</span></div></div>`}
function review(){const c=context();return `${head('Before you send',`${c.project} · ${c.agent}`,'compose')}<div class="scroll pad"><span class="badge green">Ready for your review</span><h2 class="story-title">Exactly what<br>the agent will see.</h2><p class="setting-label" style="padding-left:0">YOUR MESSAGE</p><div class="message" style="max-width:100%">${escapeHtml(state.draft||'Keep the cart and let the customer choose another payment method.')}</div><p class="setting-label" style="padding-left:0;margin-top:25px">INSTRUCTION TO ${c.agent.toUpperCase()} · ENGLISH</p><textarea aria-label="Instruction to send" id="instruction" class="editor" style="font-size:16px;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:150px">${escapeHtml(state.hebrew?'Keep the cart and let the customer choose another payment method. Do not retry automatically.':state.draft||'Keep the cart and let the customer choose another payment method.')}</textarea><p class="sub">You can edit this instruction. Translation is simulated in this mockup.</p></div><div class="choices"><button class="primary full" data-action="send">Send to ${c.agent} ${icon('send')}</button><button class="choice-other" data-go="compose">Keep editing</button></div>`}
function images(){return `<div class="lightbox">${head('Design previews','Fieldnotes · 2 images','complete',btn('close','go:complete','Close image viewer'))}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto"><div class="image-slider" id="image-slider"><div>${art(false,true)}</div><div>${art(true,true)}</div></div><div class="image-controls"><button data-action="image-prev" aria-label="Previous image">←</button><button data-action="zoom" aria-label="Toggle image zoom">${icon('plus')}</button><button data-action="image-next" aria-label="Next image">→</button></div><div class="image-caption"><strong>Two ways to slow things down.</strong>Swipe to compare the sage and terracotta directions. Tap + to zoom; scroll to inspect details.</div></div><div class="choices" style="background:#29352b;border-color:#42503d"><button class="primary full" data-go="compose">Discuss these designs</button></div></div>`}
function inbox(){return `${head('Conversations','Every agent. Every project.','home',btn('search','focus-search','Search conversations'))}<label class="search">${icon('search')}<input id="search" data-search="conversations" placeholder="Search conversations" aria-label="Search conversations"></label><div class="scroll"><div class="tabs"><span class="chip on">All conversations</span><button class="chip" data-action="unread-inbox">Unread</button></div>${[['story','C','Checkout','How should we handle a failed payment?','Waiting for you'],['complete','⌘','Fieldnotes','The landing page is ready to explore.','Completed'],['approval','C','API','Ready to run the staging migration.','Approval required'],['project','⌘','GLOSS','Checking the mobile navigation…','Working']].map(([id,a,t,p,s])=>`<button class="list-row searchable" data-go="${id==='project'?id:'chat'}" data-session="${id}" data-unread="${!state.seen[id]}" data-search-text="${t.toLowerCase()} ${p.toLowerCase()}">${avatar(a,id==='approval'?'purple':'coral')}<span class="grow"><strong>${t}</strong><p>${p}</p><span class="tiny" style="color:var(--accent)">${s}</span></span><span class="tiny muted">${state.seen[id]?'Seen':id==='project'?'4m':'●'}</span></button>`).join('')}<p id="search-empty" class="empty-copy hidden" style="margin-top:30px">No conversations match your search.</p></div>${nav('inbox')}`}
function profile(){return `<header class="app-head"><h2>Your space</h2>${btn('settings','go:settings','Open settings')}</header><div class="scroll"><div class="profile-hero"><div class="profile-avatar">KB</div><h2>Kfir Bechavod</h2><p class="sub">A few good ideas, always in motion.</p><div class="stat-grid"><div><strong>4</strong><small>projects</small></div><div><strong>8</strong><small>sessions</small></div><div><strong>2</strong><small>working now</small></div></div></div><div class="pad row between" style="margin-bottom:12px"><span class="section-label">YOUR PROJECTS</span><button class="text-link" data-go="devices">MacBook Pro ↗</button></div>${[['G','GLOSS','Language, without the friction.','2 sessions · 1 working'],['F','Fieldnotes','A home for considered objects.','3 sessions · New response'],['↗','Checkout','A better way to pay.','2 sessions · Needs you'],['A','API','The foundation underneath.','1 session · Approval required']].map(([a,t,p,s])=>`<button class="list-row" data-go="project" data-project="${t}">${avatar(a,t==='GLOSS'?'dark':'')}<span class="grow"><strong>${t}</strong><p>${p}</p><span class="tiny muted">${s}</span></span><span class="arrow">↗</span></button>`).join('')}</div>${nav('profile')}`}
function project(){const projectName=state.project;return `${head('Project','MacBook Pro · connected','profile',btn('dots','go:settings','Project preferences'))}<div class="scroll"><div class="project-banner">${avatar(projectName[0],'dark')}<h2>${projectName}</h2><p class="sub">${{GLOSS:'Work with agents in your own language.',Fieldnotes:'A home for considered objects.',Checkout:'A better way to pay.',API:'The foundation underneath.'}[projectName]}</p><div class="row between" style="margin-top:20px"><span class="tiny">⑂ main + 2 worktrees</span><span class="badge green">1 working</span></div></div><div class="pad row between" style="margin-bottom:10px"><strong class="section-label">Sessions</strong><span class="count">3</span></div>${[['⌘','Mobile navigation','Codex · mobile-navigation','Working · 4 min'],['C','Payment recovery','Claude · payment-recovery','Waiting for your choice'],['⌘','Landing page','Codex · website-redesign','Completed · new response']].map(([a,t,p,s],i)=>`<button class="list-row" data-go="${i===0?'chat':i===1?'story':'complete'}">${avatar(a,i===0?'dark':'coral')}<span class="grow"><strong>${t}</strong><p>${p}</p><span class="tiny" style="color:var(--accent)">${s}</span></span><span>›</span></button>`).join('')}<div class="help-card"><strong>Everything stays with its session.</strong><br>Replies from your phone and computer appear in the same conversation.</div><div class="pad"><button class="secondary full" data-go="inbox">Browse saved conversations</button></div></div>${nav('profile')}`}
function activity(){return `${head('Activity','The latest across your projects','home')}<div class="scroll pad"><div class="eyebrow muted" style="margin:16px 0 24px">TODAY</div>${[['Just now','Your phone is connected','MacBook Pro is online. Sessions are up to date.','devices'],['2 min ago','A new look for Fieldnotes','Codex finished the landing page. Two image previews are ready.','complete'],['8 min ago','Checkout needs a decision','Claude has two approaches to payment recovery.','story'],['12 min ago','Permission requested','Review a staging database migration before it runs.','approval'],['20 min ago','Your reply was delivered','“Keep the layout simple and preserve Hebrew support.”','chat']].map(([t,h,p,g])=>`<div class="activity-line"><span class="tiny muted">${t}</span><h3>${h}</h3><p>${p}</p><button class="text-link" data-go="${g}">Open ${icon('arrow')}</button></div>`).join('')}</div>${nav('activity')}`}
function toggleRow(title,desc,key,on=true){return `<div class="list-row"><span class="grow"><strong>${title}</strong>${desc?`<p>${desc}</p>`:''}</span><button role="switch" aria-checked="${on}" aria-label="${title}" class="switch ${on?'on':''}" data-toggle="${key}"></button></div>`}
function settings(){return `${head('Make it yours','','profile')}<div class="scroll"><div class="setting-label">Reading & appearance</div><div class="setting-group">${toggleRow('Large text','More room for every word.','large',state.large)}${toggleRow('Dark appearance','','dark',state.dark)}${toggleRow('Read replies in Hebrew','Preview right-to-left story content.','hebrew',state.hebrew)}<div class="list-row"><span class="grow"><strong>Writing language</strong></span><select aria-label="Writing language" data-language><option ${!state.hebrew?'selected':''}>English</option><option ${state.hebrew?'selected':''}>עברית</option></select></div></div><div class="setting-label">Notifications</div><div class="setting-group">${toggleRow('New agent responses','Know when there is something to read.','notifications')}${toggleRow('Questions & approvals','Know when an agent needs you.','questions')}${toggleRow('Show message previews','Off keeps response text private.','previews',false)}</div><div class="setting-label">Connections</div><div class="setting-group"><button class="list-row" data-go="devices">${icon('laptop')}<span class="grow"><strong>Computers & devices</strong><p>MacBook Pro · 2 paired phones</p></span><span>›</span></button><button class="list-row" data-go="pair">${icon('plus')}<span class="grow"><strong>Connect another computer</strong></span><span>›</span></button></div><div class="setting-label">Privacy & help</div><div class="setting-group"><button class="list-row" data-action="privacy">${icon('lock')}<span class="grow"><strong>Your conversations are yours</strong><p>About pairing and encryption</p></span><span>›</span></button><button class="list-row" data-action="help"><span class="grow"><strong>Help with mobile GLOSS</strong></span><span>›</span></button></div><p class="tiny muted center">GLOSS MOBILE · DESIGN PREVIEW 01</p></div>`}
function welcome(){return `<div class="intro"><div class="wordmark"><span class="mark">g</span>gloss.</div><div class="eyebrow" style="color:var(--accent);margin-bottom:16px">YOUR AGENTS, WITH YOU</div><h2>Good work<br>doesn’t need<br>a desk.</h2><p>Read the latest. Make a decision.<br>Keep your agents moving, wherever<br>the day takes you.</p><div class="row" style="margin-bottom:40px">${avatar('C')}${avatar('⌘','dark')}<span class="sub">Claude & Codex.<br>Your projects. Your language.</span></div><button class="primary full" data-go="pair">Connect your computer ${icon('arrow')}</button><p class="tiny center" style="margin-top:15px">Your computer runs the agents.<br>Your phone keeps you in the conversation.</p></div>`}
function pair(){return `${head('Connect your computer','','welcome')}<div class="scroll pad center"><div class="hero-icon">${icon('laptop')}</div><h2 class="empty-title">A small connection.<br>A whole new freedom.</h2><p class="sub">On your computer, open GLOSS → Settings → Phone access → Pair a phone.</p><div class="qr" aria-label="Illustrative QR code, not scannable">${Array.from({length:441},(_,i)=>`<span class="${((i*13+Math.floor(i/21)*7)%11)>5?'off':''}"></span>`).join('')}</div><span class="badge">SAMPLE QR · NOT SCANNABLE</span><div style="text-align:left;margin:20px 0"><div class="step"><b>1</b><span>Scan the QR shown on your computer with your phone camera.</span></div><div class="step"><b>2</b><span>Confirm the device name on your computer.</span></div><div class="step"><b>3</b><span>Choose whether this phone can read only, or read and reply.</span></div></div><button class="primary full" data-action="pair">Preview a successful connection ${icon('arrow')}</button><button class="choice-other" data-action="pair-help">Having trouble pairing?</button><div class="notice">This preview requests no camera access and does not connect to your computer.</div></div>`}
function devices(){return `${head('Computers & devices','','profile',btn('plus','go:pair','Pair another computer'))}<div class="scroll"><div class="setting-label">Your computer</div><div class="connection-card"><div class="row">${icon('laptop')}<span><h3>MacBook Pro</h3><p><span class="green-dot"></span>${state.paused?'Phone access paused':'Online · last synced just now'}</p></span></div><p>4 projects · 8 sessions<br>Connected through an encrypted relay</p><div class="row between" style="margin-top:15px"><span class="tiny">Allow phone access</span><button class="switch ${state.paused?'':'on'}" role="switch" aria-checked="${!state.paused}" aria-label="Allow phone access" data-action="pause"></button></div></div><div class="setting-label">Paired phones</div><div class="connection-card"><div class="row between"><span><h3>Kfir’s iPhone <span class="badge green">This device</span></h3><p>Read & reply · paired today</p></span></div><p>Device access can be revoked from your computer.</p></div>${!state.revoked?`<div class="connection-card"><div class="row between"><span><h3>Pixel 9</h3><p>Read only · last active yesterday</p></span><button class="text-link" data-action="revoke">Revoke</button></div></div>`:'<div class="connection-card"><p>Pixel 9 access revoked in this demo.</p></div>'}<div class="pad"><button class="secondary full" data-go="pair">Connect another computer</button></div><div class="help-card">${icon('lock')} Only paired devices can access your sessions. You choose which devices can reply.</div></div>`}
function offline(){return `${head('Home','MacBook Pro is offline','home')}<div class="state-strip">${icon('wifi')} Last connected 12 minutes ago</div><div class="scroll"><div class="hero-icon">${icon('laptop')}</div><h2 class="empty-title center">Your Mac is taking<br>a little break.</h2><p class="empty-copy center">Keep GLOSS open and your computer awake to continue. Your draft is safe on this phone.</p><div class="connection-card"><span class="badge">LAST KNOWN UPDATE · 9:34</span><h3 style="margin:15px 0 8px">Checkout needs your choice</h3><p>This saved response may be out of date. Sending is unavailable until the computer reconnects.</p></div><div class="pad"><textarea class="editor" style="border:1px solid var(--line);padding:14px;border-radius:12px;font-size:15px;min-height:100px" aria-label="Offline draft" id="offline-draft" placeholder="Save a thought for later…">${escapeHtml(state.draft)}</textarea><button class="secondary full" data-action="save-draft">Save draft on this phone</button><button class="primary full" style="margin-top:10px" data-action="reconnect">Simulate reconnect</button><p class="tiny muted center" style="margin-top:12px">Nothing is queued or sent automatically.</p></div></div>${nav()}`}
function error(){return `${head('Delivery status','Checkout · Claude','chat')}<div class="scroll pad"><div class="hero-icon" style="background:var(--soft);color:var(--accent)">${icon('send')}</div><h2 class="empty-title">We haven’t received<br>a delivery receipt.</h2><p class="reading muted" style="font-size:14px;margin:18px 0">Your connection dropped after sending. Claude may have received the message, so we won’t send it again automatically.</p><div class="message user">Keep the cart and let the customer choose another payment method.</div><div class="notice">Delivery unknown · Your original message is preserved.</div><button class="primary full" data-action="check-delivery">Check delivery status</button><button class="secondary full" style="margin-top:9px" data-go="chat">Open conversation</button></div>`}
function empty(){return `${head('Your updates','','home')}<div class="scroll center"><div class="hero-icon" style="margin-top:100px">${icon('sun')}</div><h2 class="empty-title">Nothing unread.<br>A little room to breathe.</h2><p class="empty-copy">You’ve seen every new response.<br>We’ll let you know when there’s more.</p><div class="connection-card" style="text-align:left"><h3>One decision is still waiting</h3><p>Seen doesn’t mean answered. Claude still needs your choice on payment recovery.</p><button class="text-link" data-go="story" style="margin-top:12px">Return to the decision →</button></div><button class="secondary" data-go="profile">Explore your projects</button></div>${nav()}`}
const renderers={home,story:()=>story(),complete:()=>story('complete'),approval:()=>story('approval'),chat,compose,review,image:images,inbox,profile,project,activity,settings,welcome,pair,devices,offline,error,empty};
function device(page){return `<div class="device ${state.dark?'dark-ui':''} ${state.large?'large-reading':''}"><div class="statusbar"><span>9:41</span><span class="island"></span><span>▮▮▮ &nbsp; ◉ &nbsp; ▰</span></div><div class="screen" data-screen="${page}">${renderers[page]()}</div></div>`}
let observer,readTimers=[];
function render(){if(observer)observer.disconnect();readTimers.forEach(clearTimeout);readTimers=[];document.getElementById('screen-index').innerHTML=screens.map(([id,name],i)=>`<button class="${!state.gallery&&state.page===id?'active':''}" data-go="${id}"><span class="num">${String(i+1).padStart(2,'0')}</span>${name}</button>`).join('');document.getElementById('gallery-button').textContent=state.gallery?'Interactive view ↗':'All screens ↗';const stage=document.getElementById('stage');stage.className=state.gallery?'gallery':'stage';const info=screens.find(s=>s[0]===state.page);stage.innerHTML=state.gallery?screens.map(([id,name,,desc],i)=>`<section class="gallery-item"><h2>${String(i+1).padStart(2,'0')} / ${name}</h2>${device(id)}<p class="gallery-note">${desc}</p></section>`).join(''):`${device(state.page)}<aside class="notes"><div class="number">${String(screens.indexOf(info)+1).padStart(2,'0')}</div><div class="eyebrow">${info[1]}</div><h2>${info[2]}</h2><p>${info[3]}</p><ul><li>Every action is a local simulation.</li><li>Use the left index to explore all 19 screens.</li><li>Reset demo restores unread responses.</li></ul><span class="note-tag">${state.page==='story'?'TRY IT → READ, THEN CHOOSE':'DESIGN PROTOTYPE · NOT CONNECTED'}</span></aside>`;if(!state.gallery)watchReading();}
function go(page){if(['story','complete','approval'].includes(page))state.session=page;if(page==='chat'&&['story','complete','approval'].includes(state.page))state.session=state.page;state.page=page;state.gallery=false;render()}
function watchReading(){const end=document.querySelector('[data-read-end]');if(!end)return;const root=end.closest('.scroll');observer=new IntersectionObserver(entries=>{readTimers.forEach(clearTimeout);readTimers=[];if(entries[0].isIntersecting){readTimers.push(setTimeout(()=>{const id=end.dataset.readEnd;state.seen[id]=true;end.innerHTML=receipt(id)},1200))}},{root,threshold:1});observer.observe(end)}
function toast(message){const screen=document.querySelector('.screen');screen?.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;screen?.append(el);setTimeout(()=>el.remove(),4500)}
document.addEventListener('input',e=>{if(e.target.id==='draft')state.draft=e.target.value;if(e.target.dataset.search){const query=e.target.value.toLowerCase();let count=0;document.querySelectorAll('.searchable').forEach(el=>{const show=el.dataset.searchText.includes(query);el.classList.toggle('hidden',!show);if(show)count++});document.getElementById('search-empty')?.classList.toggle('hidden',count>0)}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-language')){state.hebrew=e.target.value==='עברית';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(b.dataset.project)state.project=b.dataset.project;if(b.dataset.session)state.session=b.dataset.session;go(b.dataset.go);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.reply){state.answered.story=b.dataset.reply;state.sent=b.dataset.reply;state.seen.story=true;render();toast('Demo: your choice was delivered to Claude.');return}if(b.dataset.toggle){const key=b.dataset.toggle;if(['large','dark','hebrew'].includes(key)){state[key]=!state[key];render()}else{const on=b.getAttribute('aria-checked')!=='true';b.classList.toggle('on',on);b.setAttribute('aria-checked',on);toast('Preference changed for this preview.')}return}const a=b.dataset.action;if(!a)return;if(a.startsWith('go:')){go(a.slice(3));return}switch(a){case'result-reply':state.session='complete';state.draft='';go('compose');break;case'gallery':state.gallery=!state.gallery;render();break;case'reset':state.seen={};state.answered={};state.sentBy={};state.draft='';state.sent='';state.filter='All';state.project='GLOSS';state.session='story';state.large=false;state.hebrew=false;state.dark=false;state.paused=false;state.revoked=false;go('home');break;case'textsize':state.large=!state.large;render();break;case'review':if(!state.draft.trim()){toast('Write a reply or try the sample dictation first.');break}go('review');break;case'send':state.sent=document.getElementById('instruction').value;if(!state.sent.trim()){toast('Add an instruction before sending.');break}state.answered[state.session]=state.sent;state.sentBy[state.session]=state.sent;go('chat');toast('Demo: delivered to '+context().agent+'.');break;case'dictate':state.draft='Keep the cart and let the customer choose another payment method. Do not retry automatically.';go('compose');toast('Sample dictation inserted. No microphone was used.');break;case'attach':if(state.page!=='compose')go('compose');document.getElementById('attachment').innerHTML='<div class="badge green">▧ checkout-reference.png · sample attachment</div>';toast('Sample attachment added. No file was uploaded.');break;case'approve':toast('Demo: this exact staging command was approved once.');state.answered.approval='Approved once';b.textContent='✓ Approved once';b.disabled=true;break;case'deny':toast('Demo: permission denied. No command ran.');b.textContent='✓ Denied';break;case'pair':go('devices');toast('Demo: MacBook Pro paired with this phone.');break;case'pair-help':toast('Use the newest QR from GLOSS on your computer. Pairing codes expire.');break;case'pause':state.paused=!state.paused;render();toast(state.paused?'Demo: phone access paused.':'Demo: phone access enabled.');break;case'revoke':state.revoked=true;render();toast('Demo: Pixel 9 access revoked.');break;case'privacy':toast('Proposed design: encrypted content between paired devices; the relay routes messages.');break;case'help':toast('Keep the computer awake and GLOSS open. Re-pair from Settings if access was revoked.');break;case'focus-search':document.getElementById('search')?.focus();break;case'unread-inbox':document.querySelectorAll('.searchable').forEach(el=>el.classList.toggle('hidden',el.dataset.unread!=='true'));b.classList.add('on');break;case'save-draft':state.draft=document.getElementById('offline-draft').value;toast('Draft preserved for this demo session. Nothing was sent.');break;case'reconnect':go('home');toast('Demo: reconnected. Your draft has not been sent.');break;case'check-delivery':state.sent='Keep the cart and let the customer choose another payment method.';go('chat');toast('Demo: receipt found. Delivered once; not resent.');break;case'image-prev':case'image-next':{const slider=document.getElementById('image-slider');slider.scrollBy({left:slider.clientWidth*(a==='image-next'?1:-1),behavior:'smooth'});break}case'zoom':{const slider=document.getElementById('image-slider');const zoomed=slider.dataset.zoom==='true';slider.dataset.zoom=String(!zoomed);slider.querySelectorAll('.art').forEach(el=>{el.style.width=zoomed?'100%':'160%';el.style.height=zoomed?'320px':'480px'});toast(zoomed?'Fit to screen':'Zoomed · scroll to inspect the preview');break}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')go('home')});
render();
</script>
</body>
